worker_processes auto;
pid /run/nginx.pid;

# Include any enabled modules
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;  # Ensure mime.types is included
    default_type application/octet-stream;
    error_log /var/log/nginx/error_log;

    upstream backend {
        server 127.0.0.1:8080;
    }
    # Server block for the Weather Report Reverse Proxy
    server {
        listen $PORT;
        server_name localhost 127.0.0.1;
        client_max_body_size 100M;
        # Root location serving the frontend (SPA)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;  # Serve index.html for SPA routing
        }

        # Reverse proxy for /api/ to backend service
        location /api/ {
            proxy_pass http://backend;  # Proxy to backend service
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache off;  # Disable caching for API responses

                # CORS headers for API
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, DELETE, PUT';
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
        }

        # Serve .js and .mjs files with the correct MIME type
        location ~* \.js$ {
            root /usr/share/nginx/html;
            add_header Content-Type application/javascript;
        }

        # Specifically handle sw.js
        location /sw.js {
            root /usr/share/nginx/html;
            add_header Content-Type application/javascript;
        }

         location /registerSW.js {
            root /usr/share/nginx/html;
            add_header Content-Type application/javascript;
        }
    }
}